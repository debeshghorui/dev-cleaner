[package]
name = "devclean"
version = "0.1.0"
edition = "2021"
description = "Cross-platform TUI that finds regenerable developer caches and moves them to the trash"
readme = "README.md"

[[bin]]
name = "devclean"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rayon = "1.10"
trash = "5"
walkdir = "2"
